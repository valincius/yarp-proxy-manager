name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (dotnet build + test + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ProxyManager.slnx
      - name: Build
        run: dotnet build ProxyManager.slnx --no-restore -c Release
      - name: Install coverage tool
        run: dotnet tool install --global dotnet-coverage
      - name: Test + coverage
        run: |
          mkdir -p coverage
          dotnet-coverage collect "dotnet test ProxyManager.slnx --no-build -c Release --logger trx" -f cobertura -o coverage/backend.cobertura.xml
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend.cobertura.xml

  frontend:
    name: Frontend (pnpm test + build + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test + coverage
        run: pnpm test:coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: web/coverage
      - name: Build
        run: pnpm build
